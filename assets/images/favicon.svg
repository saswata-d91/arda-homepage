<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="CuraSync Favicon">
  <defs>
    <linearGradient id="favNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071930" />
      <stop offset="100%" stop-color="#0B2546" />
    </linearGradient>
    <linearGradient id="favTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="favCrossHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#favNavyGrad)" stroke="#163e74" stroke-width="1.5" />
  
  <!-- Sync Arc 1: Upper Right -->
  <path d="M 21 14 A 23 23 0 0 1 52 30" stroke="url(#favTealGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 55 35 L 47 29 L 54.5 26.5 Z" fill="#06B6D4" />

  <!-- Sync Arc 2: Lower Left -->
  <path d="M 43 50 A 23 23 0 0 1 12 34" stroke="url(#favTealGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 9 29 L 17 35 L 9.5 37.5 Z" fill="#0891B2" />

  <!-- Medical Cross Vertical Bar (White) -->
  <rect x="28" y="17" width="8" height="30" rx="4" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Medical Cross Horizontal Bar (Teal) -->
  <rect x="17" y="28" width="30" height="8" rx="4" fill="url(#favCrossHoriz)" />

  <!-- Center Intersection Accent -->
  <rect x="28" y="28" width="8" height="8" rx="2" fill="#38BDF8" opacity="0.9" />
</svg>
